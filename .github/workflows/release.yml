name: zip
on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
    branches:
      - main

permissions:
  contents: write

jobs:
  zip-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 🤐 Zip Datapack
        uses: actions/checkout@v5
      - name: Load release metadata
        id: metadata
        run: |
          ruby <<'RUBY'
          require "yaml"

          metadata = YAML.load_file("release.yml")
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "RELEASE_NAME=#{metadata.fetch("Name")}"
            output.puts "VERSION=#{metadata.fetch("version")}"
            output.puts "MINECRAFT_VERSION=#{metadata.fetch("minecraft_version")}"
            output.puts "NOTES<<EOF"
            output.write(metadata.fetch("notes"))
            output.puts unless metadata.fetch("notes").end_with?("\n")
            output.puts "EOF"
          end
          RUBY
      - name: Remove test files
        run: |
          rm -rf \
            build/Dont-Sleep/data/dont_sleep/function/test \
            build/Dont-Sleep/data/dont_sleep/structure/test \
            build/Dont-Sleep/data/dont_sleep/test_environment \
            build/Dont-Sleep/data/dont_sleep/test_instance
      - name: Zip datapack
        env:
          ASSET_PATH: ${{ steps.metadata.outputs.RELEASE_NAME }}_v${{ steps.metadata.outputs.VERSION }}_${{ steps.metadata.outputs.MINECRAFT_VERSION }}.zip
        run: |
          cd build/Dont-Sleep
          zip -r "../../$ASSET_PATH" .
      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.metadata.outputs.VERSION }}_${{ steps.metadata.outputs.MINECRAFT_VERSION }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi
      - name: Create and upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_PATH: ${{ steps.metadata.outputs.RELEASE_NAME }}_v${{ steps.metadata.outputs.VERSION }}_${{ steps.metadata.outputs.MINECRAFT_VERSION }}.zip
          RELEASE_NAME: ${{ steps.metadata.outputs.RELEASE_NAME }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.NOTES }}
          RELEASE_TAG: v${{ steps.metadata.outputs.VERSION }}_${{ steps.metadata.outputs.MINECRAFT_VERSION }}
        run: |
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_NAME v${{ steps.metadata.outputs.VERSION }} ${{ steps.metadata.outputs.MINECRAFT_VERSION }}" \
            --notes "$RELEASE_NOTES"